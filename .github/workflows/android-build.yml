name: Build Fyne Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем код вашего проекта
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Используем готовый официальный экшен для сборки Fyne-приложений
      # Он сам настроит Go, Docker и всё необходимое без ручных команд "go install"
      - name: Build Fyne Application
        uses: fyne-io/action-fyne-cross@v1
        with:
          target: android
          arch: arm64
          app-id: com.dahua.scanner

      # 3. Публикуем готовый APK-файл в артефакты
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app-arm64
          path: container-dist/android/*.apk
