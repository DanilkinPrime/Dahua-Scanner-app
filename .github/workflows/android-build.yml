name: Build Fyne Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем код вашего проекта
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Настраиваем компилятор Go 1.27.2
      - name: Set up Go 1.27.2
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true

      # 3. Скачиваем утилиту fyne-cross
      - name: Install fyne-cross
        run: |
          go install github.com/fyne-io/fyne-cross@latest

      # 4. Запускаем компиляцию с правильным флагом -app-id
      - name: Package APK for Android (ARM64)
        run: |
          $(go env GOPATH)/bin/fyne-cross android -arch arm64 -app-id com.dahua.scanner

      # 5. Выкладываем готовый APK в артефакты
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app-arm64
          path: fyne-cross/dist/android/*.apk
