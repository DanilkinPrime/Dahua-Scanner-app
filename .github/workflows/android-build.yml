name: Build Fyne Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go 1.27.2
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true

      - name: Install fyne-cross
        run: |
          go env -w GO111MODULE=on
          go install ://github.com

      - name: Package APK for Android (ARM64)
        run: |
          /home/runner/go/bin/fyne-cross android --arch arm64 --appID com.dahua.scanner

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app-arm64
          path: fyne-cross/dist/android/*.apk
